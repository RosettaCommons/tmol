repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.2
    hooks:
      - id: clang-format
        args: ['-i']
        files: \.(c|cc|cpp|h|hh|cu|cuh)$
        exclude: >
            (?x)^(
                tmol/extern/.* |
                dev/.* 
            )$
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        exclude: >
            (?x)^(
                tmol/extern/.* |
                dev/.* |
                \.conda/.*
            )$
  - repo: https://github.com/pycqa/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        exclude: >
            (?x)^(
                tmol/extern/.* |
                dev/.* |
                \.venv/.*
            )$
  - repo: local
    hooks:
      - id: tmol-api-style
        name: tmol API naming style (docs/style_guide.md)
        entry: python scripts/check_api_style.py
        language: python
        pass_filenames: false
        files: ^(tmol/.*\.py|docs/style_guide\.md|scripts/(check_api_style\.py|api_style_baseline\.txt))$
        exclude: ^tmol/(extern|tests)/
