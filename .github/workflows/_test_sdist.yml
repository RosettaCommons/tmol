name: ~Install source distribution through package index

on:
  workflow_call:
    inputs:
      source-ref:
        type: string
        default: ""
        description: Verified release commit; empty uses current tools for candidate recovery.
      candidate-run-id:
        type: string
        default: ""

jobs:
  install:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MAX_JOBS: "2"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref }}
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        if: inputs.candidate-run-id != ''
        with:
          name: sdist
          path: dist
          run-id: ${{ inputs.candidate-run-id }}
          github-token: ${{ github.token }}
      - name: Install source build tools
        run: python -m pip install build packaging 'scikit-build-core>=0.10'
      - name: Build source distribution without compiling extensions
        if: inputs.candidate-run-id == ''
        run: |
          python -m build --sdist --no-isolation --skip-dependency-check --outdir dist
      - name: Inspect shared-core dependency
        id: core
        shell: bash
        run: |
          if [ -f scripts/package_requirements.py ]; then
            python scripts/package_requirements.py --github-output "$GITHUB_OUTPUT" dist/*.tar.gz
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build shared core wheel and sdist
        if: inputs.candidate-run-id == '' && steps.core.outputs.required == 'true'
        run: |
          python scripts/build_core.py --outdir core-dist
          python scripts/check_pure_artifacts.py core-dist/tmol_core-*.whl core-dist/tmol_core-*.tar.gz
      - uses: actions/download-artifact@v4
        if: inputs.candidate-run-id != '' && steps.core.outputs.required == 'true'
        with:
          name: tmol-core
          path: core-dist
          run-id: ${{ inputs.candidate-run-id }}
          github-token: ${{ github.token }}
      - name: Validate source metadata
        run: python scripts/validate_pypi_sdist.py dist/*.tar.gz
      - name: Resolve, build, install and score from the source index
        run: |
          args=()
          if [ "${{ steps.core.outputs.required }}" = true ]; then
            args+=(--core-wheel core-dist/tmol_core-*.whl)
          fi
          python scripts/test_package_install.py --sdist dist/*.tar.gz \
            "${args[@]}" --torch-version '2.14.1'
      - uses: actions/upload-artifact@v4
        if: inputs.candidate-run-id == ''
        with:
          name: sdist
          path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        if: inputs.candidate-run-id == '' && steps.core.outputs.required == 'true'
        with:
          name: tmol-core
          path: core-dist/*
