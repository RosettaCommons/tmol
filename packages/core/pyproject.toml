[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmol-core"
dynamic = ["version"]
description = "Framework-independent chemistry and host preparation for TMol"
readme = "README.md"
license = "BSD-3-Clause AND Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.25",
    "attrs>=21",
    "cattrs>=22",
    "pint>=0.23,<1",
    "pyyaml>=6",
    "networkx>=3",
    "scipy>=1.11",
    "frozendict>=2",
    "toolz>=0.10",
    "numba>=0.56",
    "biotite==1.6.0",
    "atomworks>=3.0.0,<4",
    "rdkit>=2024.3.5",
]

[project.optional-dependencies]
ligand = [
    "openbabel-wheel>=3.1.1.23,<4",
]

[project.urls]
Repository = "https://github.com/RosettaCommons/tmol"
Documentation = "https://rosettacommons.github.io/tmol/"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
include = ["tmol_core*"]

[tool.setuptools.package-data]
tmol_core = ["NOTICE", "default/chemical/*.yaml", "extern/pysmiles/LICENSE.md"]
